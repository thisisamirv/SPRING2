---
name: CI

"on":
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            name: Linux x64 GCC
            cc: gcc
            cxx: g++
            ninja_path: tools/host/ninja/linux/ninja
            build_dir: out/build

          - os: ubuntu-latest
            name: Linux x64 Clang
            cc: clang
            cxx: clang++
            ninja_path: tools/host/ninja/linux/ninja
            build_dir: out/build-linux-clang
            extra_deps: clang lld

          - os: ubuntu-24.04-arm
            name: Linux ARM64 GCC
            cc: gcc
            cxx: g++
            ninja_path: tools/host/ninja/linux-aarch64/ninja
            build_dir: out/build-linux-arm64
            use_docker: true

          # macOS builds
          - os: macos-15-intel
            name: macOS x64 Clang
            cc: clang
            cxx: clang++
            ninja_path: tools/host/ninja/mac/ninja
            build_dir: out/build

          - os: macos-latest
            name: macOS ARM64 Clang
            cc: clang
            cxx: clang++
            ninja_path: tools/host/ninja/mac/ninja
            build_dir: out/build-macos-arm64

          # Windows builds
          - os: windows-latest
            name: Windows x64 GCC
            cc: gcc
            cxx: g++
            build_dir: out/build
            windows_toolchain: mingw

          - os: windows-latest
            name: Windows x64 MSVC
            cc: cl
            cxx: cl
            build_dir: out/build-windows-msvc
            windows_toolchain: msvc

          - os: windows-latest
            name: Windows x64 Clang
            cc: clang
            cxx: clang++
            build_dir: out/build-windows-clang
            windows_toolchain: msys2-clang

          - os: windows-latest
            name: Windows x64 ClangCL
            cc: clang-cl
            cxx: clang-cl
            build_dir: out/build-windows-clangcl
            windows_toolchain: clangcl

          - os: windows-11-arm
            name: Windows ARM64 MSVC
            cc: cl
            cxx: cl
            build_dir: out/build-windows-arm64
            windows_toolchain: msvc-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      # ========== Setup Steps ==========

      - name: Ensure vendored tools are executable on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x tools/host/ninja/linux/ninja tools/host/ninja/linux-aarch64/ninja tools/host/ninja/mac/ninja
          chmod +x tools/host/nasm/linux/nasm tools/host/nasm/macosx/nasm

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.use_docker != true
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang-tidy \
            cppcheck \
            libomp-dev \
            lld \
            mold \
            python3 \
            python3-pip \
            python3-venv \
            valgrind \
            ${{ matrix.extra_deps }}

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          # Silence Homebrew's noisy update chatter (new formulae lists, analytics
          # nags, outdated-formula banners).  Errors still surface via exit code.
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          # Remove third-party taps that produce broken-formula errors or
          # deprecation warnings during `brew update` (hashicorp/tap/vagrant has
          # no URL; aws/tap emits end-of-life SAM CLI warnings). Untap first so
          # the subsequent `brew update` does not try to refresh them.
          brew untap aws/tap aws/tap-nightly hashicorp/tap 2>/dev/null || true
          brew update 2>/dev/null || true
          brew install ccache libomp lld llvm cppcheck python
          echo "MACOS_LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "HOMEBREW_LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"

      - name: Install CMake on Linux and macOS (non-Docker)
        if: runner.os != 'Windows' && matrix.use_docker != true
        shell: bash
        run: |
          CMAKE_VENV="$RUNNER_TEMP/cmake-venv"
          python3 -m venv "$CMAKE_VENV"
          "$CMAKE_VENV/bin/python" -m pip install --no-cache-dir --upgrade pip
          "$CMAKE_VENV/bin/python" -m pip install --no-cache-dir "cmake==4.2.0"
          echo "$CMAKE_VENV/bin" >> "$GITHUB_PATH"
          "$CMAKE_VENV/bin/cmake" --version

      - name: Install MinGW-w64 toolchain for Windows GCC
        if: matrix.windows_toolchain == 'mingw'
        shell: powershell
        run: |
          $wingetFlags = @(
            "--source", "winget",
            "--exact",
            "--accept-source-agreements",
            "--accept-package-agreements",
            "--disable-interactivity"
          )

          # winget exits with 0x8A15002B (-1978335189) when the package is already
          # installed and no upgrade is available. Treat that as success.
          function Invoke-Winget {
            param([string[]]$Args)
            winget install @Args
            if ($LASTEXITCODE -ne 0) {
              Write-Host "winget exited with code $LASTEXITCODE (may already be installed at latest version)"
            }
            $global:LASTEXITCODE = 0
          }

          Invoke-Winget --id BrechtSanders.WinLibs.MCF.UCRT @wingetFlags
          Invoke-Winget --id Mozilla.sccache --exact @wingetFlags
          Invoke-Winget --id Git.Git @wingetFlags

          Write-Host 'Configuring PATH for WinLibs GCC toolchain'
          $searchRoots = @(
            "$env:LOCALAPPDATA\Microsoft\WinGet\Packages",
            "$env:LOCALAPPDATA\Microsoft\WinGet\Links",
            "$env:ProgramFiles\WinLibs",
            "$env:ProgramFiles\mingw64",
            "$env:SystemDrive\mingw64"
          ) | Where-Object { Test-Path $_ }

          $gcc = $null
          foreach ($root in $searchRoots) {
            $gcc = Get-ChildItem -Path $root -Filter gcc.exe -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($gcc) { break }
          }

          if (-not $gcc) {
            throw 'Unable to locate gcc.exe after WinLibs installation'
          }

          $vendoredNasmDir = Join-Path $env:GITHUB_WORKSPACE 'tools/host/nasm/win64'
          if (Test-Path (Join-Path $vendoredNasmDir 'nasm.exe')) {
            Add-Content -Path $env:GITHUB_PATH -Value $vendoredNasmDir
            Write-Host "Using vendored NASM directory: $vendoredNasmDir"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $gcc.DirectoryName

      - name: Set up MSYS2 for Windows Clang or analysis
        id: setup-msys2
        if: matrix.windows_toolchain == 'msys2-clang' || (runner.os == 'Windows' && matrix.windows_toolchain == 'mingw')
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.windows_toolchain == 'msys2-clang' && 'CLANG64' || 'UCRT64' }}
          update: false
          install: >-
            ${{ matrix.windows_toolchain == 'msys2-clang' && 'mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-llvm-openmp mingw-w64-clang-x86_64-cppcheck' || 'mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-clang-tools-extra mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-cppcheck' }}

      - name: Expose MSYS2 tools on PATH
        if: matrix.windows_toolchain == 'msys2-clang'
        shell: powershell
        run: |
          $msys2Root = '${{ steps.setup-msys2.outputs.msys2-location }}'
          if (-not $msys2Root -or -not (Test-Path $msys2Root)) {
            $msys2Root = @('C:\msys64', 'D:\msys64') | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($msys2Root) {
            Add-Content -Path $env:GITHUB_PATH -Value "$msys2Root\clang64\bin"
            Add-Content -Path $env:GITHUB_PATH -Value "$msys2Root\usr\bin"
            Add-Content -Path $env:GITHUB_ENV -Value "SPRING_MSYS2_ROOT=$msys2Root"
            Write-Host "MSYS2 root: $msys2Root"
          }

      - name: Expose MSYS2 UCRT64 tools on PATH for analysis
        if: runner.os == 'Windows' && matrix.windows_toolchain == 'mingw'
        shell: powershell
        run: |
          $msys2Root = '${{ steps.setup-msys2.outputs.msys2-location }}'
          if (-not $msys2Root -or -not (Test-Path $msys2Root)) {
            $msys2Root = @('C:\msys64', 'D:\msys64') | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($msys2Root) {
            Add-Content -Path $env:GITHUB_PATH -Value "$msys2Root\ucrt64\bin"
            Add-Content -Path $env:GITHUB_PATH -Value "$msys2Root\usr\bin"
            Add-Content -Path $env:GITHUB_ENV -Value "SPRING_MSYS2_ROOT=$msys2Root"
            Write-Host "MSYS2 root: $msys2Root"
          }

      - name: Install cppcheck via MSYS2 for MSVC analysis
        if: runner.os == 'Windows' && (matrix.windows_toolchain == 'msvc' || matrix.windows_toolchain == 'clangcl')
        shell: powershell
        run: |
          # The WinLibs cppcheck pre-installed on the runner image was compiled
          # with FILESDIR=R:/winlibs64ucrt_stage/... which does not exist on CI
          # runners, causing it to fail immediately with "Failed to load std.cfg".
          # Install the MSYS2 UCRT64 cppcheck (properly configured) so it can be
          # used directly in the cppcheck run step. Try both C: and D: since
          # the MSYS2 root varies across runner images.
          $bashExe = @('C:\msys64\usr\bin\bash.exe', 'D:\msys64\usr\bin\bash.exe') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bashExe) { Write-Error 'MSYS2 bash.exe not found'; exit 1 }
          & $bashExe -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-cppcheck'

      - name: Resolve Visual Studio environment
        if: matrix.windows_toolchain == 'msvc' || matrix.windows_toolchain == 'clangcl' || matrix.windows_toolchain == 'msvc-arm64'
        shell: powershell
        run: |
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vsWhere)) {
            throw 'Unable to locate vswhere.exe to detect installed Visual Studio versions'
          }

          $candidates = @(
            @{ Version = '[18.0,19.0)'; Generator = 'Visual Studio 18 2026' },
            @{ Version = '[17.0,18.0)'; Generator = 'Visual Studio 17 2022' }
          )

          $vcComponent = if ('${{ matrix.windows_toolchain }}' -eq 'msvc-arm64') {
            'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          } else {
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          }

          $selectedGenerator = $null
          $installationPath = $null
          foreach ($candidate in $candidates) {
            $vsWhereArgs = @(
              '-version', $candidate.Version,
              '-products', '*',
              '-requires', $vcComponent,
              '-property', 'installationPath'
            )
            $vsWhereOutput = @(& $vsWhere @vsWhereArgs)
            $resolvedInstallationPath = if ($vsWhereOutput.Count -gt 0) { $vsWhereOutput[0].Trim() } else { $null }
            if ($resolvedInstallationPath) {
              $selectedGenerator = $candidate.Generator
              $installationPath = $resolvedInstallationPath
              break
            }
          }

          if (-not $selectedGenerator -or -not $installationPath) {
            throw 'Unable to find a supported Visual Studio installation'
          }

          $vsDevCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd)) {
            throw "Unable to locate VsDevCmd.bat under $installationPath"
          }

          $ninjaPath = if ('${{ matrix.windows_toolchain }}' -eq 'msvc-arm64') {
            'tools/host/ninja/winarm64/ninja.exe'
          } else {
            'tools/host/ninja/win/ninja.exe'
          }
          $vendoredNinja = Join-Path $env:GITHUB_WORKSPACE $ninjaPath
          $vendoredNasm = Join-Path $env:GITHUB_WORKSPACE 'tools/host/nasm/win64/nasm.exe'

          if (-not (Test-Path $vendoredNinja)) {
            throw "Unable to locate vendored Ninja at $vendoredNinja"
          }
          if (-not (Test-Path $vendoredNasm)) {
            throw "Unable to locate vendored NASM at $vendoredNasm"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "SPRING_VSDEVCMD=$vsDevCmd"
          Add-Content -Path $env:GITHUB_ENV -Value "SPRING_WINDOWS_NINJA=$vendoredNinja"
          Add-Content -Path $env:GITHUB_ENV -Value "SPRING_WINDOWS_NASM=$vendoredNasm"
          Write-Host "Using Visual Studio environment: $vsDevCmd"
          Write-Host "Using vendored Ninja: $vendoredNinja"
          Write-Host "Using vendored NASM: $vendoredNasm"

      - name: Install CMake on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vendoredNasmDir = Join-Path $env:GITHUB_WORKSPACE 'tools/host/nasm/win64'
          if (Test-Path (Join-Path $vendoredNasmDir 'nasm.exe')) {
            Add-Content -Path $env:GITHUB_PATH -Value $vendoredNasmDir
            Write-Host "Using vendored NASM directory: $vendoredNasmDir"
          }

          $cmakeVenv = Join-Path $env:RUNNER_TEMP 'cmake-venv'
          py -3 -m venv $cmakeVenv
          & "$cmakeVenv\Scripts\python.exe" -m pip install --upgrade pip
          & "$cmakeVenv\Scripts\python.exe" -m pip install "cmake==4.2.0"
          Add-Content -Path $env:GITHUB_PATH -Value "$cmakeVenv\Scripts"
          & "$cmakeVenv\Scripts\cmake.exe" --version

      # ========== Build Steps ==========

      - name: Build and test Linux ARM64 in Docker
        if: matrix.use_docker == true
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -e container=docker \
            -v "$PWD":/work -w /work arm64v8/almalinux:8 /bin/bash -c "
            dnf install -y --setopt=install_weak_deps=False epel-release dnf-plugins-core && \
            (dnf config-manager --set-enabled powertools || \
              dnf config-manager --set-enabled crb) && \
            dnf install -y --setopt=install_weak_deps=False --setopt=tsflags=noscripts gcc-toolset-12-gcc-c++ libomp-devel \
              python39 python39-pip cppcheck && \
            source /opt/rh/gcc-toolset-12/enable && \
            python3.9 -m venv .cmake-venv && \
            . .cmake-venv/bin/activate && \
            chmod +x /work/${{ matrix.ninja_path }} /work/tools/host/nasm/linux/nasm && \
            python3.9 -m pip install --no-cache-dir --upgrade pip && \
            python3.9 -m pip install --no-cache-dir 'cmake==4.2.0' && \
            cmake -S . -B ${{ matrix.build_dir }} -G Ninja \
              -DCMAKE_MAKE_PROGRAM=/work/${{ matrix.ninja_path }} \
              -DLIBRAPIDARCHIVE_WITH_ISAL=OFF \
              -DCMAKE_C_FLAGS='-march=armv8-a+crc' \
              -DCMAKE_CXX_FLAGS='-march=armv8-a+crc' \
              -DSPRING_ENABLE_IPO=OFF && \
            cmake --build ${{ matrix.build_dir }} --parallel && \
            ctest --test-dir ${{ matrix.build_dir }} --output-on-failure --verbose && \
            python3.9 tools/dev/lint/cppcheck.py
          "

      - name: Configure on Linux (non-Docker)
        if: runner.os == 'Linux' && matrix.use_docker != true
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$GITHUB_WORKSPACE/${{ matrix.ninja_path }}"

      - name: Configure on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$GITHUB_WORKSPACE/${{ matrix.ninja_path }}" \
            -DOpenMP_ROOT="$MACOS_LIBOMP_PREFIX"

      - name: Configure on Windows with MinGW
        if: matrix.windows_toolchain == 'mingw'
        shell: powershell
        run: |
          $env:CC="${{ matrix.cc }}"
          $env:CXX="${{ matrix.cxx }}"
          $vendoredNinja = Join-Path $env:GITHUB_WORKSPACE 'tools/host/ninja/win/ninja.exe'
          $vendoredNasm = Join-Path $env:GITHUB_WORKSPACE 'tools/host/nasm/win64/nasm.exe'
          $ninjaExe = $null
          if (Test-Path $vendoredNinja) {
            try {
              & $vendoredNinja --version | Out-Null
              $ninjaExe = $vendoredNinja
            } catch {
              Write-Host "Vendored Ninja is not runnable; falling back to PATH discovery."
            }
          }
          if (-not $ninjaExe) {
            $ninjaCommand = Get-Command ninja.exe -ErrorAction SilentlyContinue
            if ($ninjaCommand) {
              $ninjaExe = $ninjaCommand.Source
            }
          }
          if (-not $ninjaExe) {
            throw 'Unable to locate a working ninja.exe for CMake'
          }
          $ninjaExe = $ninjaExe -replace '\\','/'
          if (-not (Test-Path $vendoredNasm)) {
            throw 'Unable to locate vendored nasm.exe for CMake'
          }
          $vendoredNasm = $vendoredNasm -replace '\\','/'
          Write-Host "Using Ninja executable: $ninjaExe"
          Write-Host "Using vendored NASM executable: $vendoredNasm"
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja -DCMAKE_MAKE_PROGRAM="$ninjaExe" -DSPRING_NASM_EXECUTABLE="$vendoredNasm"

      - name: Configure on Windows with MSYS2 Clang
        if: matrix.windows_toolchain == 'msys2-clang'
        shell: powershell
        run: |
          $env:CC='${{ matrix.cc }}'
          $env:CXX='${{ matrix.cxx }}'
          $vendoredNinja = Join-Path $env:GITHUB_WORKSPACE 'tools/host/ninja/win/ninja.exe'
          $vendoredNasm = Join-Path $env:GITHUB_WORKSPACE 'tools/host/nasm/win64/nasm.exe'
          $ninjaExe = $null
          if (Test-Path $vendoredNinja) {
            try {
              & $vendoredNinja --version | Out-Null
              $ninjaExe = $vendoredNinja
            } catch {
              Write-Host "Vendored Ninja is not runnable; falling back to PATH discovery."
            }
          }
          if (-not $ninjaExe) {
            $ninjaCommand = Get-Command ninja.exe -ErrorAction SilentlyContinue
            if ($ninjaCommand) {
              $ninjaExe = $ninjaCommand.Source
            }
          }
          if (-not $ninjaExe) {
            throw 'Unable to locate a working ninja.exe for CMake'
          }
          $ninjaExe = $ninjaExe -replace '\\','/'
          if (-not (Test-Path $vendoredNasm)) {
            throw 'Unable to locate vendored nasm.exe for CMake'
          }
          $vendoredNasm = $vendoredNasm -replace '\\','/'
          Write-Host "Using Ninja: $ninjaExe"
          Write-Host "Using NASM: $vendoredNasm"
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja -DCMAKE_MAKE_PROGRAM="$ninjaExe" -DSPRING_NASM_EXECUTABLE="$vendoredNasm"

      - name: Configure on Windows with MSVC toolchain
        if: matrix.windows_toolchain == 'msvc' || matrix.windows_toolchain == 'clangcl' || matrix.windows_toolchain == 'msvc-arm64'
        shell: powershell
        run: |
          $vsDevCmd = $env:SPRING_VSDEVCMD
          $ninjaExe = $env:SPRING_WINDOWS_NINJA -replace '\\','/'
          $nasmExe = $env:SPRING_WINDOWS_NASM -replace '\\','/'
          $arch = if ('${{ matrix.windows_toolchain }}' -eq 'msvc-arm64') { 'arm64' } else { 'amd64' }
          $buildType = 'Release'
          $configureCommand = "call `"$vsDevCmd`" -no_logo -arch=$arch -host_arch=$arch && set CC=${{ matrix.cc }} && set CXX=${{ matrix.cxx }} && cmake -S . -B ${{ matrix.build_dir }} -G Ninja -DCMAKE_BUILD_TYPE=$buildType -DCMAKE_MAKE_PROGRAM=`"$ninjaExe`" -DSPRING_NASM_EXECUTABLE=`"$nasmExe`""
          cmd /c $configureCommand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build on Linux and macOS (non-Docker)
        if: runner.os != 'Windows' && matrix.use_docker != true
        run: |
          cmake --build ${{ matrix.build_dir }} --parallel

      - name: Build on Windows with MinGW or MSYS2 Clang
        if: matrix.windows_toolchain == 'mingw' || matrix.windows_toolchain == 'msys2-clang'
        shell: powershell
        run: |
          if (Test-Path 'docs/assets/icons/logo.png') {
            magick docs/assets/icons/logo.png `
              -define icon:auto-resize=16,32,48,64,128,256 `
              docs/assets/icons/logo.ico
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ImageMagick failed (exit $LASTEXITCODE); skipping icon conversion."
              $global:LASTEXITCODE = 0
            }
          }
          $env:CC='${{ matrix.cc }}'
          $env:CXX='${{ matrix.cxx }}'
          cmake --build ${{ matrix.build_dir }} --parallel

      - name: Build on Windows with MSVC toolchain
        if: matrix.windows_toolchain == 'msvc' || matrix.windows_toolchain == 'clangcl' || matrix.windows_toolchain == 'msvc-arm64'
        shell: powershell
        run: |
          # ARM64 runners ship an x64 ImageMagick that cannot locate its
          # CoderModulesPath registry key under an ARM64 process, so skip
          # icon conversion there entirely.
          if ('${{ matrix.windows_toolchain }}' -ne 'msvc-arm64' -and (Test-Path 'docs/assets/icons/logo.png')) {
            magick docs/assets/icons/logo.png `
              -define icon:auto-resize=16,32,48,64,128,256 `
              docs/assets/icons/logo.ico
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ImageMagick failed (exit $LASTEXITCODE); skipping icon conversion."
              $global:LASTEXITCODE = 0
            }
          }
          $vsDevCmd = $env:SPRING_VSDEVCMD
          $arch = if ('${{ matrix.windows_toolchain }}' -eq 'msvc-arm64') { 'arm64' } else { 'amd64' }
          $buildCommand = "call `"$vsDevCmd`" -no_logo -arch=$arch -host_arch=$arch && cmake --build ${{ matrix.build_dir }} --parallel"
          cmd /c $buildCommand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ========== Test Steps ==========

      - name: Run tests on Linux and macOS (non-Docker)
        if: success() && runner.os != 'Windows' && matrix.use_docker != true
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure --verbose

      - name: Run tests on Windows with MinGW or MSYS2 Clang
        if: success() && (matrix.windows_toolchain == 'mingw' || matrix.windows_toolchain == 'msys2-clang')
        shell: powershell
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure --verbose

      - name: Run tests on Windows with MSVC toolchain
        if: success() && (matrix.windows_toolchain == 'msvc' || matrix.windows_toolchain == 'clangcl' || matrix.windows_toolchain == 'msvc-arm64')
        shell: powershell
        run: |
          $vsDevCmd = $env:SPRING_VSDEVCMD
          $arch = if ('${{ matrix.windows_toolchain }}' -eq 'msvc-arm64') { 'arm64' } else { 'amd64' }
          $testCommand = "call `"$vsDevCmd`" -no_logo -arch=$arch -host_arch=$arch && ctest --test-dir ${{ matrix.build_dir }} --output-on-failure --verbose"
          cmd /c $testCommand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ========== Lint and Analysis Steps ==========

      - name: Run lint on Linux (non-Docker)
        if: success() && runner.os == 'Linux' && matrix.use_docker != true
        run: python3 tools/dev/lint/lint.py --build-dir ${{ matrix.build_dir }}

      - name: Run lint on macOS
        if: success() && runner.os == 'macOS'
        shell: bash
        run: |
          export PATH="$HOMEBREW_LLVM_BIN:$PATH"
          python3 tools/dev/lint/lint.py --build-dir ${{ matrix.build_dir }}

      - name: Run lint on Windows
        if: success() && runner.os == 'Windows' && matrix.windows_toolchain != 'msvc-arm64' && matrix.windows_toolchain != 'msvc'
        shell: powershell
        run: py -3 .\tools\dev\lint\lint.py --build-dir ${{ matrix.build_dir }}

      - name: Run cppcheck on Linux (non-Docker)
        if: success() && runner.os == 'Linux' && matrix.use_docker != true
        run: python3 tools/dev/lint/cppcheck.py

      - name: Run cppcheck on macOS
        if: success() && runner.os == 'macOS'
        run: python3 tools/dev/lint/cppcheck.py

      - name: Run cppcheck on Windows
        if: success() && runner.os == 'Windows' && matrix.windows_toolchain != 'msvc-arm64'
        shell: powershell
        run: |
          # Search the MSYS2 root detected during setup (saved to SPRING_MSYS2_ROOT),
          # then fall back to the common MSYS2 installation roots (C: and D:) and both
          # ucrt64 and clang64 subsystems for a working cppcheck, skipping
          # broken pre-installed binaries from WinLibs and Strawberry Perl.
          $cppcheckExe = $null
          $msys2Candidates = @()
          if ($env:SPRING_MSYS2_ROOT) {
            $msys2Candidates += "$env:SPRING_MSYS2_ROOT\ucrt64\bin\cppcheck.exe"
            $msys2Candidates += "$env:SPRING_MSYS2_ROOT\clang64\bin\cppcheck.exe"
          }
          $msys2Candidates += @(
            'C:\msys64\ucrt64\bin\cppcheck.exe',
            'C:\msys64\clang64\bin\cppcheck.exe',
            'D:\msys64\ucrt64\bin\cppcheck.exe',
            'D:\msys64\clang64\bin\cppcheck.exe'
          )
          foreach ($candidate in $msys2Candidates) {
            if (Test-Path $candidate) { $cppcheckExe = $candidate; break }
          }
          if (-not $cppcheckExe) {
            $cppcheckExe = Get-Command cppcheck.exe -All -ErrorAction SilentlyContinue |
              Where-Object { $_.Source -notmatch 'WinGet|WinLibs|winlibs|Strawberry' } |
              Select-Object -ExpandProperty Source -First 1
          }
          if (-not $cppcheckExe) {
            Write-Error 'cppcheck.exe not found in any known MSYS2 location or PATH'
            exit 1
          }
          Write-Host "Using cppcheck: $cppcheckExe"
          $env:CPPCHECK = $cppcheckExe
          py -3 .\tools\dev\lint\cppcheck.py

      - name: Run valgrind smoke test on Linux x64
        if: matrix.name == 'Linux x64 GCC'
        run: python3 tools/dev/smoke/valgrind_smoke.py

  conda-build-and-test:
    name: Conda / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          python-version: "3.11"

      - name: Install rattler-build
        shell: bash -l {0}
        run: |
          conda install -y rattler-build
          rattler-build --version

      - name: Prepare CI recipe (replace URL source with local path)
        shell: bash -l {0}
        run: |
          python3 - <<'EOF'
          import re, shutil, pathlib

          src = pathlib.Path('tools/conda/recipe')
          dst = pathlib.Path('tools/conda/recipe-ci')
          dst.mkdir(exist_ok=True)

          text = (src / 'recipe.yaml').read_text()
          # Replace the source block (url + sha256) with a path pointing at
          # the repo root so CI builds from the current checkout, not the
          # tagged tarball.
          text = re.sub(
              r'^source:\n(  \S[^\n]*\n)+',
              'source:\n  path: ../../..\n',
              text,
              flags=re.MULTILINE,
          )
          # stdlib('c') requires a c_stdlib variant config supplied by
          # conda-forge infrastructure; remove it for local CI builds.
          text = re.sub(r"^\s*- \$\{\{ stdlib\('c'\) \}\}\n", '', text, flags=re.MULTILINE)
          (dst / 'recipe.yaml').write_text(text)

          for script in ('build.sh', 'build.bat'):
              s = src / script
              if s.exists():
                  shutil.copy(s, dst / script)
          print((dst / 'recipe.yaml').read_text())
          EOF

      - name: Build conda package with rattler-build
        shell: bash -l {0}
        run: |
          rattler-build build \
            --recipe-dir tools/conda/recipe-ci \
            --output-dir output/conda \
            -c conda-forge

      - name: Install and smoke test conda package
        shell: bash -l {0}
        run: |
          LOCAL_CHANNEL=$(python3 -c "
          import pathlib
          print(pathlib.Path('output/conda').resolve().as_uri())
          ")
          conda create -y -n spring2-conda-test
          conda install -y -n spring2-conda-test \
            -c "$LOCAL_CHANNEL" \
            -c conda-forge \
            spring2
          conda run -n spring2-conda-test spring2 --version
          conda run -n spring2-conda-test spring2 --help

      - name: Run round-trip tests on installed conda package
        shell: bash -l {0}
        run: |
          set -e
          DATA="$GITHUB_WORKSPACE/tests/data"
          TMP="$GITHUB_WORKSPACE/tmp_conda_roundtrip"
          mkdir -p "$TMP"

          run() { conda run -n spring2-conda-test "$@"; }

          echo "--- single-end FASTQ round-trip ---"
          run spring2 -c --R1 "$DATA/test_1.fastq" -o "$TMP/single.sp"
          run spring2 -d -i "$TMP/single.sp" -o "$TMP/single_out.fastq"
          diff "$DATA/test_1.fastq" "$TMP/single_out.fastq"

          echo "--- paired-end FASTQ round-trip ---"
          run spring2 -c --R1 "$DATA/test_1.fastq" --R2 "$DATA/test_2.fastq" -o "$TMP/paired.sp"
          run spring2 -d -i "$TMP/paired.sp" -o "$TMP/paired_out"
          diff "$DATA/test_1.fastq" "$TMP/paired_out.1"
          diff "$DATA/test_2.fastq" "$TMP/paired_out.2"

          echo "--- single-end FASTA round-trip ---"
          run spring2 -c --R1 "$DATA/test_1.fasta" -o "$TMP/fasta.sp"
          run spring2 -d -i "$TMP/fasta.sp" -o "$TMP/fasta_out.fasta"
          diff "$DATA/test_1.fasta" "$TMP/fasta_out.fasta"

          echo "--- gzipped FASTQ input round-trip ---"
          run spring2 -c --R1 "$DATA/test_1.fastq.gz" -o "$TMP/gz.sp"
          run spring2 -d -i "$TMP/gz.sp" -o "$TMP/gz_out.fastq" -u
          diff "$DATA/test_1.fastq" "$TMP/gz_out.fastq"

          echo "--- archive preview ---"
          run spring2 -p -i "$TMP/single.sp"

          rm -rf "$TMP"
          echo "All round-trip tests passed."

  sanitizers:
    name: Sanitizers / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASan and UBSan, TSan]
        include:
          - sanitizer: ASan and UBSan
            build_dir: out/build-asan
            san_flags: "-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -Wno-stringop-overflow -Wno-array-bounds"
            ld_flags: "-fsanitize=address,undefined"
            options: "ASAN_OPTIONS=detect_leaks=1:abort_on_error=1"
          - sanitizer: TSan
            build_dir: out/build-tsan
            san_flags: "-g -O1 -fno-omit-frame-pointer -fsanitize=thread -Wno-stringop-overflow -Wno-array-bounds"
            ld_flags: "-fsanitize=thread"
            options:
              "TSAN_OPTIONS=halt_on_error=1:suppressions=${{ github.workspace
              }}/tests/support/tsan.supp"
    env:
      BUILD_DIR: ${{ matrix.build_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Ensure vendored tools are executable
        run: |
          chmod +x tools/host/ninja/linux/ninja tools/host/ninja/linux-aarch64/ninja
          chmod +x tools/host/nasm/linux/nasm

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev python3 python3-pip python3-venv

      - name: Install CMake (pip v4.2.0)
        run: |
          CMAKE_VENV="$RUNNER_TEMP/cmake-venv"
          python3 -m venv "$CMAKE_VENV"
          "$CMAKE_VENV/bin/python" -m pip install --no-cache-dir --upgrade pip
          "$CMAKE_VENV/bin/python" -m pip install --no-cache-dir "cmake==4.2.0"
          echo "$CMAKE_VENV/bin" >> "$GITHUB_PATH"

      - name: Configure CMake with sanitizer flags
        run: |
          if [ "${{ matrix.sanitizer }}" = "TSan" ]; then
            echo "TSAN_OPTIONS=halt_on_error=1:suppressions=$GITHUB_WORKSPACE/tests/support/tsan.supp" >> $GITHUB_ENV
          else
            echo "${{ matrix.options }}" >> $GITHUB_ENV
          fi
          cmake -S . -B $BUILD_DIR -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$GITHUB_WORKSPACE/tools/host/ninja/linux/ninja" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSPRING_ENABLE_IPO=OFF \
            -DCMAKE_C_FLAGS="${{ matrix.san_flags }}" -DCMAKE_CXX_FLAGS="${{ matrix.san_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.ld_flags }}" -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.ld_flags }}"

      - name: Build
        run: |
          cmake --build $BUILD_DIR -j

      - name: Run all tests (Unit + Smoke) with Sanitizers
        env:
          BUILD_DIR: ${{ github.workspace }}/${{ matrix.build_dir }}
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.sanitizer }}-build-artifacts
          path: |
            $BUILD_DIR
