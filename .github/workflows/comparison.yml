---
name: Comparison

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison-bench:
    name: Build, install, and compare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Ensure vendored tools are executable
        shell: bash
        run: |
          chmod +x tools/host/ninja/linux/ninja tools/host/ninja/linux-aarch64/ninja
          chmod +x tools/host/nasm/linux/nasm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libomp-dev \
            python3 \
            python3-pip \
            python3-venv

      - name: Install CMake on Linux
        shell: bash
        run: |
          CMAKE_VENV="$RUNNER_TEMP/cmake-venv"
          python3 -m venv "$CMAKE_VENV"
                            "$CMAKE_VENV/bin/python" -m pip install --no-cache-dir --upgrade pip
                            "$CMAKE_VENV/bin/python" -m pip install --no-cache-dir "cmake==4.2.0"
          echo "$CMAKE_VENV/bin" >> "$GITHUB_PATH"
          "$CMAKE_VENV/bin/cmake" --version

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B out/build -G Ninja \
              -DCMAKE_MAKE_PROGRAM="$GITHUB_WORKSPACE/tools/host/ninja/linux/ninja"

      - name: Build and install
        run: |
          cmake --build out/build --parallel
                            cmake --install out/build --prefix out

      - name: Install mamba
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: false
          conda-remove-defaults: true
          use-mamba: true

      - name: Create spring_v1 environment with bioconda::spring
        shell: bash -el {0}
        run: |
          mamba --version
          mamba create -y -n spring_v1 -c conda-forge -c bioconda bioconda::spring

      - name: Run comparison benchmark
        shell: bash -el {0}
        run: |
          python3 tests/bench/comparison_bench.py
